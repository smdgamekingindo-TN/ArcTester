services:
  - type: web
    name: arctester-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: None
      - key: GMAIL_USER
        value: smdgameking@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: ArcTester
      - key: APP_BASE_URL
        value: https://arctester.vercel.app
