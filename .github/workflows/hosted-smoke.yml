name: ArcTester Hosted Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: arctester-hosted-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed web and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCTESTER_WEB_URL: ${{ vars.ARCTESTER_WEB_URL }}
      ARCTESTER_API_URL: ${{ vars.ARCTESTER_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check hosted smoke configuration
        id: smoke_config
        run: |
          if [[ -z "$ARCTESTER_WEB_URL" || -z "$ARCTESTER_API_URL" ]]; then
            echo "skip_smoke=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Hosted smoke checks skipped: configure repository variables ARCTESTER_WEB_URL and ARCTESTER_API_URL to enable live deployment checks."
          else
            echo "skip_smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run HTTPS hosted smoke checks
        if: steps.smoke_config.outputs.skip_smoke == 'false'
        run: bash scripts/hosted-smoke.sh
